# The point of this job is not more testing — the suite is fast and runs locally.
# It is that the first machine other than the author's should be GitHub's rather
# than a user's, and that the thing proved to work is the tarball npm would
# actually serve. Obserf ships raw TypeScript, runs on Bun, carries its
# migrations as package data, and scaffolds a workspace that installs itself;
# none of that is exercised by running tests in a checkout.
#
# Deliberately offline. A scan against live Hacker News or GitHub would turn a
# deterministic suite into somebody else's uptime monitor, and there are no
# credentials to give it. The live clean-room scan stays a manual pre-release step.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs these checks against the tagged commit before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version input: the action reads `packageManager` from package.json,
      # so the pinned Bun is declared in one place rather than two.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Types
        run: bun run typecheck

      - name: Tests
        run: bun test

      # vocabulary.ts is shared with the browser, so a stray import in it drags
      # bun:sqlite, the Agent SDK or child_process into the inbox bundle. That
      # fails at runtime in a browser, which no test here would catch.
      - name: Browser bundle carries no server imports
        run: |
          bun build web/index.html --outdir /tmp/bundle
          if grep -rqE 'bun:sqlite|child_process|claude-agent-sdk|drizzle-orm' /tmp/bundle; then
            echo "::error::a server-only import reached the browser bundle"
            grep -roE 'bun:sqlite|child_process|claude-agent-sdk|drizzle-orm' /tmp/bundle | sort -u
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version input: the action reads `packageManager` from package.json,
      # so the pinned Bun is declared in one place rather than two.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # `files` is an explicit whitelist: it keeps an operator's database out of
      # the tarball, but a new source file is easy to forget. Nothing here reads
      # the list; the steps below prove each file present by running a command
      # that needs it.
      - name: Pack
        run: |
          npm pack --pack-destination /tmp >/dev/null
          echo "TARBALL=$(ls /tmp/obserf-*.tgz)" >> "$GITHUB_ENV"

      - name: No database is ever in the tarball
        run: |
          if tar tzf "$TARBALL" | grep -E '\.db(-wal|-shm)?$'; then
            echo "::error::the tarball contains a database"
            exit 1
          fi

      # What a user does, in the order they do it, with nothing from this
      # checkout on the path.
      - name: A workspace built from the tarball works
        run: |
          set -eux
          mkdir -p /tmp/tool && cd /tmp/tool && bun add "$TARBALL"
          cd /tmp && ./tool/node_modules/.bin/obserf init workspace
          cd /tmp/workspace && bun add "@obserf/cli@$TARBALL"
          bun run typecheck                    # the scaffolded tsconfig checks the example profile
          bun run obserf projects              # resolves `obserf` from a profile
          bun run obserf list                  # creates and migrates the database
          test -f .obserf/obserf.db
          bun run obserf runs                  # reads the run table the migration adds
          bun run obserf backup                # snapshot and restore round-trip
          bun run obserf restore

      # A scan of the untouched scaffold is refused before a request goes out,
      # which makes this the offline way to exercise profile loading and the
      # guard from the installed package.
      - name: A scan refuses the untouched example
        run: |
          set -eux
          cd /tmp/workspace
          # `if`, not `! cmd | tee`: a pipeline reports the last command's status,
          # so the negation would pass on tee's success no matter what the scan did.
          if ./node_modules/.bin/obserf scan --dry-run >/tmp/scan.log 2>&1; then
            echo "::error::a scan of the untouched scaffold was not refused"
            cat /tmp/scan.log
            exit 1
          fi
          if ! grep -q "scaffold placeholder queries remain" /tmp/scan.log; then
            echo "::error::the scan failed, but not on the scaffold guard"
            cat /tmp/scan.log
            exit 1
          fi

      # `serve` is the only command that bundles, at request time. A file missing
      # from `files` leaves every other command passing and the server binding
      # while the page answers 500, so the page has to actually be fetched.
      - name: The inbox serves its page from the installed package
        run: |
          set -eux
          cd /tmp/workspace
          # The binary, not `bun run obserf`: that wrapper is a second process,
          # and killing it can leave the server holding the port.
          ./node_modules/.bin/obserf serve --port 4137 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:4137/ >/tmp/page.html
          grep -q "<title>Obserf</title>" /tmp/page.html
          curl -fsS http://127.0.0.1:4137/api/projects >/tmp/projects.json
          grep -q '"key":"example"' /tmp/projects.json

          # Each status is captured before it is compared, so `set -e` sees
          # curl's own failure; inside `test "$(curl …)"` it would not.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:4137/api/findings?min=abc')
          test "$code" = 400

          # The write that used to reach a foreign key and answer with Bun's
          # development error page. Its body must say why, and carry no source
          # or paths.
          code=$(curl -sS -o /tmp/refusal.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{"status":"acted"}' \
            http://127.0.0.1:4137/api/findings/abc/triage)
          test "$code" = 400
          grep -q '"error"' /tmp/refusal.json
          if grep -qE '__bunfallback|\.ts"|/tmp/workspace' /tmp/refusal.json; then
            echo "::error::a refusal carried the server's source or its paths"
            exit 1
          fi

          # DNS rebinding: a rebound page's `Host` names the attacker's domain.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' \
            http://127.0.0.1:4137/api/findings)
          test "$code" = 403
          # The page too, as defense in depth. That check is Bun's own and exists
          # only while `development` is on; any refusal will do, not just 403.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' \
            http://127.0.0.1:4137/)
          [[ "$code" == 4?? ]]
