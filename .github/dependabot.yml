# Monthly and grouped: one pull request per ecosystem, so updates arrive as a
# batch CI can check rather than a stream to triage.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
